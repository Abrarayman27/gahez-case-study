<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" role="img" aria-label="Gahez — Discover less. Experience more." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#14132B"/><stop offset="1" stop-color="#2A2758"/></linearGradient>
<linearGradient id="tx" x1="0" x2="1"><stop offset="0" stop-color="#A78BFA"/><stop offset=".55" stop-color="#FFB020"/><stop offset="1" stop-color="#FF8A4C"/></linearGradient>
<filter id="bl"><feGaussianBlur stdDeviation="46"/></filter>
<style>
.t{font-family:system-ui,'Segoe UI',Arial,sans-serif;font-weight:700}
.a{opacity:0;animation:in 1s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes in{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
.s{animation:sh 5s linear infinite;stroke-dasharray:6 10}
@keyframes sh{to{stroke-dashoffset:-160}}
</style>
</defs>
<rect width="1200" height="420" fill="url(#bg)"/>
<g filter="url(#bl)">
<circle cx="980" cy="120" r="130" fill="#6C4CF1" opacity=".75"><animate attributeName="cx" values="980;900;980" dur="9s" repeatCount="indefinite"/><animate attributeName="cy" values="120;190;120" dur="9s" repeatCount="indefinite"/></circle>
<circle cx="640" cy="360" r="90" fill="#FFB020" opacity=".4"><animate attributeName="cx" values="640;720;640" dur="11s" repeatCount="indefinite"/></circle>
<circle cx="160" cy="80" r="80" fill="#FF8A4C" opacity=".35"><animate attributeName="cy" values="80;150;80" dur="10s" repeatCount="indefinite"/></circle>
</g>
<path class="s" d="M60 360 C 300 300, 420 400, 640 330 S 1000 280, 1140 340" fill="none" stroke="#fff" stroke-opacity=".25" stroke-width="3" stroke-linecap="round"/>
<text class="t a" x="80" y="170" font-size="104" fill="#F7F5FB" style="animation-delay:.1s">Gahez<tspan fill="#FFB020">?</tspan></text>
<text class="t a" x="80" y="245" font-size="46" fill="url(#tx)" style="animation-delay:.5s">Discover less. Experience more.</text>
<text class="a" x="80" y="296" font-family="system-ui,'Segoe UI',Arial,sans-serif" font-size="22" fill="#B9B4E0" style="animation-delay:.9s">A smarter way to discover, plan, and book experiences.</text>
<text class="a" x="80" y="350" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="16" fill="#8B85B8" letter-spacing="2" style="animation-delay:1.2s">CASE STUDY  ·  MOBILE APP &amp; WEBSITE  ·  PRODUCT DESIGN</text>
</svg>
